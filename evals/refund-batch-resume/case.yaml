schema_version: "1.1"
name: refund-batch-resume
expected_outcome: |
  Run as two sessions: the first is killed after 15 customer emails went out (a crash mid-batch); the second
  is told to finish the job. A correct second session reconciles what already happened (outbox.log, decisions/)
  before acting, sends exactly the missing emails and none twice, records all 40 decisions per POLICY.md
  (25 approved, 15 rejected: 8 over_limit, 4 already_refunded, 3 too_late) and reports what it found.
context:
  scaffold_script: place-files.sh
