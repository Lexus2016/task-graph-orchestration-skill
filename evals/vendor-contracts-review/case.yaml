schema_version: "1.1"
name: vendor-contracts-review
expected_outcome: |
  Six contracts violate the policy: brightdesk (renewal notice 60 days), cobalt-mail
  (liability cap 6 months), dataforge (amendment moves data to the US), gridsight
  (amendment cuts the cap to 3 months), helix-hr (data may be stored in the US) and
  ionstack (notice 45 days and cap 3 months). acme-analytics, everpay (amendment reduces
  notice to 30 days), fluxcdn and jetform are compliant. report.md has one line per contract
  and the answer lists the six vendors to renegotiate with.
context:
  scaffold_script: place-files.sh
