schema_version: "1.1"
name: intraday-backtest-audit
expected_outcome: |
  backtest.py deviates from STRATEGY.md in five ways: it keeps 5-minute bars (minute // 5)
  instead of building 15-minute bars; it shifts the cross signal so orders fill on the bar
  whose close produced the cross (look-ahead); it charges no fees; it ignores the intraday
  rule (no same-day check on entries, positions held overnight, no end-of-day exit, an open
  position at the end of data is dropped); and it counts wins on gross instead of net return.
  Corrected on Aug-Oct 2026: total_return_pct -3.96, 201 trades, win rate 24.9%,
  max drawdown 18.3% — versus Dani's +283.9%, 646 trades, 57%, 3.04%. The fixed script must
  also be correct on unseen data. Recommendation: no-go.
context:
  scaffold_script: place-files.sh
